<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awesome Autoparts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/shop">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.7 3.7L12 11.7 5.3 8 12 4.3ZM5 9.7l6 3.3v6.6l-6-3.3V9.7Zm8 9.9V13l6-3.3v6.6l-6 3.3Z"/></svg>
        </span>
        <span>Awesome<b>Autoparts</b></span>
      </a>

      <nav class="mode-switch" aria-label="Mode">
        <a href="#/shop" data-mode="shop">Shop</a>
        <a href="#/staff" data-mode="staff">Staff</a>
      </nav>

      <div class="topbar-actions">
        <label class="store-picker" title="Your store">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
          <select id="store-select" aria-label="Store"></select>
        </label>
        <a class="icon-btn" href="#/account" id="account-btn" title="Account">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5Z"/></svg>
          <span id="account-label">Sign in</span>
        </a>
        <button class="icon-btn cart-btn" id="cart-btn" title="Cart">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM5.2 4H2V2h4.8l1 2H21l-3.5 8H8.5l-1 2H19v2H4.3l2.6-5L5.2 4Z"/></svg>
          <span class="badge" id="cart-count" hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="container" tabindex="-1"></main>

  <aside class="drawer" id="cart-drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <div class="drawer-panel" role="dialog" aria-label="Cart">
      <div class="drawer-head">
        <h2>Your cart</h2>
        <button class="icon-btn" data-close aria-label="Close">✕</button>
      </div>
      <div id="cart-body" class="drawer-body"></div>
    </div>
  </aside>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <div class="modal-panel" role="dialog">
      <button class="icon-btn modal-close" data-close aria-label="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="chart-tip" id="chart-tip" hidden></div>

  <footer class="footer">
    CSCE 4350 · Auto Parts System demo · Python + SQLite backend
  </footer>

  <script src="app.js"></script>
</body>
</html>
